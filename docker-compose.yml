version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: dum_and_co_db
    environment:
      POSTGRES_DB: dum_and_co
      POSTGRES_USER: dum_user
      POSTGRES_PASSWORD: dum_password_local_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dum_user -d dum_and_co"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dum_and_co_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dum_and_co_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: dev-local-secret-key-dum-co-99128
      POSTGRES_DB: dum_and_co
      POSTGRES_USER: dum_user
      POSTGRES_PASSWORD: dum_password_local_123
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      RAZORPAY_KEY_ID: rzp_test_mock_key
      RAZORPAY_KEY_SECRET: rzp_test_mock_secret
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
